<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>XX과학고 과학실</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css">
<style>
:root{
  --inv-h:80pt; --inv-bg:#3a3a3a; --popup-bg:rgba(18,18,18,.9); --slot-fill:#161616; --slot-line:#ffffff;
  --desc-bg:rgba(0,0,0,.8); --select:#ffd400; --pad:rgba(58,58,58,.55); --txt:#f2f2f2;
  --font:'Galmuri11','Galmuri9','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --btn-min:0px; --msg-size:15pt;
}
body.mobile{--msg-size:12pt}
body.mobile.ml{--inv-h:60pt}
body.a11y{--btn-min:44px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0d0d0d;color:var(--txt);font-family:var(--font);overflow:hidden;word-break:keep-all;
  user-select:none;-webkit-user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
img,canvas{image-rendering:pixelated;image-rendering:crisp-edges}
button{font-family:var(--font)}

/* 인벤토리 */
#inv{position:fixed;left:0;top:0;width:100%;height:var(--inv-h);background:var(--inv-bg);z-index:30}
.slot{position:absolute;background:var(--slot-fill);border:2px solid var(--slot-line);display:flex;align-items:center;justify-content:center}
.slot img{width:80%;height:80%;cursor:pointer}
.slot img.sel{outline:2px solid var(--select);outline-offset:1px}

/* 메타버스 영역 */
#world{position:fixed;left:0;right:0;bottom:0;top:var(--inv-h);background:#101010;overflow:hidden}
#map{position:absolute;cursor:pointer}
.olabel{position:absolute;transform:translate(-50%,-100%);width:max-content;background:rgba(0,0,0,.7);color:#fff;padding:3px 9px;font-size:12px;
  white-space:nowrap;pointer-events:none;border-radius:3px;z-index:5}
#hint{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(0,0,0,.65);padding:7px 14px;font-size:13px;
  border-radius:4px;display:none;pointer-events:none;z-index:6;white-space:nowrap}
#pad{position:absolute;left:16px;bottom:16px;display:none;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px);z-index:6}
#pad button{background:var(--pad);border:none;color:#e8e8e8;font-size:18px;border-radius:6px;touch-action:none}
#pad button:active,#pad button.on{background:rgba(110,110,110,.7)}
#act{position:absolute;right:20px;bottom:calc(26px + 15pt);display:none;background:var(--pad);border:2px solid #fff;color:#fff;font-size:15px;
  padding:14px 18px;border-radius:8px;z-index:6;touch-action:none}
body.mobile #pad{display:grid}

/* 가상 팝업창 */
#popup{position:absolute;inset:0;background:var(--popup-bg);display:none;flex-direction:column;align-items:center;justify-content:center;
  z-index:20;container-type:size;transform:translateY(100%);padding-top:calc(var(--msg-size)*1.45 + 30px)}
.pp-stage{position:relative;width:min(92cqw,calc((100cqh - 96px)*1.6));aspect-ratio:16/10}
.pp-stage .ill{position:absolute;inset:0;width:100%;height:100%}
.pp-actions{min-height:64px;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;padding-top:8px}
.pp-note{font-size:12px;color:#bbb}
#pclose{position:absolute;top:10px;right:12px;width:36px;height:36px;min-width:var(--btn-min);min-height:var(--btn-min);display:none;
  align-items:center;justify-content:center;background:transparent;border:2px solid #fff;color:#fff;font-size:18px;cursor:pointer;z-index:3}
.pitem,.psprite{position:absolute;transform:translate(-50%,-50%);aspect-ratio:1}
.pitem img,.psprite img{width:100%;height:100%;display:block}
.pitem.clickable{cursor:pointer}
.pitem{outline:2px solid transparent;outline-offset:1px;transition:outline-color .3s}
.pitem.sel{outline-color:var(--select);transition:none}
.pitem.gold{outline-color:var(--select)}
.ptext{position:absolute;transform:translate(-50%,-50%);color:#fff;font-size:13px;white-space:nowrap;text-shadow:0 1px 0 #000}
.flashc{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,#fff 0,#fff 30%,rgba(255,255,255,0) 60%);opacity:0;pointer-events:none}

/* 공통 버튼 / 상자 */
.btn{background:transparent;color:#fff;border:2px solid #fff;padding:7px 16px;font-size:14px;cursor:pointer;
  min-height:var(--btn-min);min-width:var(--btn-min)}
.btn:hover{background:rgba(255,255,255,.12)}
.box{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--popup-bg);padding:22px 28px;width:max-content;max-width:min(540px,88vw);
  text-align:center;font-size:16px;line-height:1.65;z-index:70;opacity:0;white-space:pre-line}
.box .btns{display:flex;justify-content:center;gap:12px;margin-top:16px;flex-wrap:wrap}
.box.inpop{position:absolute;z-index:4}
.box input{display:block;margin:14px auto 0;width:min(320px,70vw);background:#000;border:2px solid #fff;color:#fff;font-family:var(--font);
  font-size:18px;padding:8px 10px;text-align:center;letter-spacing:2px;user-select:text;-webkit-user-select:text}
#tut{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--popup-bg);padding:22px 30px;width:max-content;max-width:min(520px,86vw);
  text-align:center;font-size:16px;line-height:1.65;z-index:70;display:none;opacity:0}
#tut .btns{display:flex;justify-content:center;gap:12px;margin-top:16px}

/* 화면 위 문구 */
#msg{position:fixed;left:50%;top:calc(var(--inv-h) + 16px);transform:translateX(-50%);color:#fff;font-size:var(--msg-size);padding:6px 18px;
  background:rgba(28,28,28,.72);box-shadow:0 0 12px 8px rgba(28,28,28,.72);border-radius:10px;z-index:60;pointer-events:none;opacity:0;
  display:none;width:max-content;max-width:min(92vw,900px);text-align:center;line-height:1.45;word-break:keep-all}

/* 설명창 */
#desc{position:fixed;background:var(--desc-bg);padding:10px 14px;z-index:65;display:none;max-width:250px;color:#fff}
#desc .dn{font-size:14px;font-weight:bold;margin-bottom:5px}
#desc .dt{font-size:12px;line-height:1.55;white-space:pre-line}
#desc .db{text-align:center;margin-top:9px}
#desc .btn{font-size:13px;padding:5px 14px}

/* 강조 */
#hl{position:fixed;inset:0;pointer-events:none;z-index:55;display:none}
#hl .hole{position:absolute;box-shadow:0 0 0 300vmax rgba(0,0,0,.6);outline:4px solid transparent;outline-offset:-4px;border-radius:3px}
#hl .hole.blink{animation:hlb .75s linear 2}
@keyframes hlb{0%,55%{outline-color:var(--select)}56%,100%{outline-color:transparent}}

/* 영상 / 엔딩 */
#cine{position:absolute;inset:0;background:#000;display:none;z-index:45;align-items:center;justify-content:center;flex-direction:column}
#cine video{width:100%;height:100%;object-fit:contain;background:#000}
.ph{color:#aaa;text-align:center;line-height:1.8;font-size:14px}
.endt{font-size:22px;color:#fff;opacity:0;text-align:center;padding:0 16px}
.endb{font-size:40px;color:#fff;opacity:0;margin-top:22px;letter-spacing:4px}

#rotate{position:fixed;inset:0;background:#111;z-index:300;display:none;align-items:center;justify-content:center;text-align:center;
  font-size:16px;line-height:1.8;padding:20px}
@media (orientation:portrait){ body.mobile.ml #rotate{display:flex} }
#restart{position:absolute;top:8px;right:8px;z-index:6;display:none;background:transparent;border:1px solid rgba(255,255,255,.25);
  color:rgba(255,255,255,.45);font-size:11px;padding:4px 8px;cursor:pointer;min-width:var(--btn-min);min-height:var(--btn-min)}
#restart:hover{color:#fff;border-color:#fff}
.endr{margin-top:28px;opacity:0}

/* 검사기 화면 */
.screen{position:absolute;container-type:size;display:flex;flex-direction:column;color:#e9eef2;overflow:hidden}
.scr-bar{height:9%;font-size:5.2cqh;display:flex;align-items:center;padding-left:2%;background:#1d2a38;color:#bcd}
.chart{width:100%;flex:0 0 54%}
.chart .t{font-size:3.1px;fill:#e9eef2;font-family:var(--font)}
.chart .v{font-size:3.1px;fill:#fff;font-family:var(--font)}
.plate-area{flex:1;display:flex;flex-direction:column;padding:1% 4% 2%}
.plate{height:44%;background:#c9d0d6;border:2px solid #8d969e;border-radius:999px;display:grid;grid-template-columns:repeat(5,1fr);
  align-items:center;justify-items:center;padding:0 3%}
.well{height:78%;aspect-ratio:1;border-radius:50%;background:#7d868e;border:2px solid #4b5258;display:flex;align-items:center;
  justify-content:center;cursor:pointer;font-size:5.5cqh;color:#203040;box-shadow:inset 0 0 0 3px rgba(255,255,255,.35)}
.well span{width:72%;height:72%;border-radius:50%;background:#f3e1e6;display:flex;align-items:center;justify-content:center}
.well.done{cursor:default;filter:brightness(.92)}
.infos{flex:1;display:grid;grid-template-columns:repeat(5,1fr);padding:0 3%}
.info{display:flex;flex-direction:column;align-items:center;gap:4%;padding-top:2%}
.idesc{font-size:4.2cqh;text-align:center;opacity:0;line-height:1.3}
.isel{font-size:4.4cqh;padding:1.5% 6%;border-width:1px;opacity:0;display:none;min-height:0;min-width:0}

#dbg{position:fixed;left:8px;bottom:8px;z-index:400;background:rgba(10,10,10,.94);border:1px solid #666;padding:10px;width:290px;
  max-height:80vh;overflow:auto;font-size:12px;display:none}
#dbg button{background:#222;color:#ddd;border:1px solid #555;font-size:11px;padding:3px 6px;margin:2px;cursor:pointer}
#dbg select{background:#222;color:#ddd;border:1px solid #555;font-size:11px}
#dbg .h{color:#ffd400;margin:6px 0 3px}
</style>
</head>
<body>
<div id="inv"></div>
<div id="world">
  <canvas id="map"></canvas>
  <div id="labels"></div>
  <div id="hint">스페이스 바를 눌러 상호작용</div>
  <div id="pad">
    <span></span><button data-d="up">▲</button><span></span>
    <button data-d="left">◀</button><span></span><button data-d="right">▶</button>
    <span></span><button data-d="down">▼</button><span></span>
  </div>
  <button id="act">상호작용</button>
  <div id="popup">
    <button id="pclose" aria-label="닫기">✕</button>
    <div class="pp-stage" id="stage"></div>
    <div class="pp-actions" id="acts"></div>
  </div>
  <div id="cine"></div>
  <button id="restart">↺ 처음부터</button>
</div>
<div id="msg"><span id="msgT"></span></div>
<div id="desc"></div>
<div id="hl"><div class="hole"></div></div>
<div id="tut"><div class="tx"></div><div class="btns"></div></div>
<div id="rotate">화면을 가로로 돌려 주세요.<br>(가로 모드에 최적화되어 있습니다)</div>
<div id="dbg"></div>

<script>
'use strict';
/* =====================================================================
   설정 블록 — 교체·수정은 주로 이 부분만 하면 됩니다.
   ===================================================================== */
// 기능 스위치 (되돌리기 명령: "4번 보완 취소" → save:false / "9번 항목 되돌려줘" → a11y:false)
const FEATURES = { closeButton:true, save:true, mobileLayout:true, sfx:true, debug:true, a11y:true };

// 엔딩 영상 경로 (index.html과 같은 폴더의 video/ 폴더)
const VIDEO = { ending1:'video/ending1.mp4', ending2:'video/ending2.mp4', placeholderSec:33 };

// 쥐별 치료제 항체 가변부위 유전자 서열
const SEQ = { A:'ATGCATGGATAA', B:'ATGTGCAACTAG' };

// 항원-항체 반응 검사 결과 [좀비 바이러스 결합도, 정상 세포 결합도]
const TEST_DATA = { A:[42,20], B:[76,28], C:[91,5], D:[65,17], E:[95,63] };
const ANSWER = 'C';

// 효과음: {type, f:[주파수...], d:음 하나 길이(초), v:볼륨} 또는 'sfx/파일.mp3' 처럼 파일 경로
const SFX = {
  click:{type:'square',f:[660],d:.04,v:.08},
  get:{type:'square',f:[523,784],d:.07,v:.1},
  place:{type:'square',f:[784,523],d:.07,v:.1},
  error:{type:'sawtooth',f:[196,147],d:.1,v:.08},
  open:{type:'triangle',f:[330,660],d:.08,v:.16},
  close:{type:'triangle',f:[660,330],d:.08,v:.16},
  done:{type:'square',f:[523,659,784,1047],d:.08,v:.09},
  tick:{type:'square',f:[988],d:.03,v:.07},
  flash:{type:'noise',d:.45,v:.18},
  end:{type:'triangle',f:[392,523,659,784,1047],d:.2,v:.15},
};

// 아이템 이름·설명 (임시 문구 — 확정 문구를 받으면 교체)
const ITEMS = {
  epithelial:{name:'정상적인 사람 구강 상피세포', desc:'사람의 입안 점막에서 얻은 정상 세포.\n항체가 정상 세포에 잘못 결합하지 않는지 확인하는 대조군으로 쓰인다.'},
  cancer:{name:'암세포', desc:'끝없이 분열하는 생쥐의 골수종(암)세포.\nB림프구와 융합하면 잡종세포가 계속 증식할 수 있게 된다.'},
  medium:{name:'잡종세포 배지', desc:'HAT 배지. 융합되지 않은 세포는 살아남지 못하고\n잡종세포만 선택적으로 자랄 수 있다.'},
  ratA:{name:'실험용 쥐 A', desc:'좀비 바이러스에 감염된 실험용 쥐.\n바이러스에 대한 항체를 만드는 B림프구를 가지고 있다.'},
  ratB:{name:'실험용 쥐 B', desc:'좀비 바이러스에 감염된 실험용 쥐.\n바이러스에 대한 항체를 만드는 B림프구를 가지고 있다.'},
  bcell:{name:'B림프구', desc:'감염된 쥐의 비장에서 추출한 B림프구 클론들.\n항체를 만들지만 몸 밖에서는 오래 증식하지 못한다.'},
  virus:{name:'좀비 바이러스 조각', desc:'비활성화 처리한 좀비 바이러스의 표면 단백질 조각.\n항원-항체 반응 검사에서 항원으로 쓰인다.'},
  hybrid:{name:'잡종세포', desc:'B림프구와 암세포가 융합된 세포.\n항체를 만들면서 계속 분열할 수 있다.'},
  hybridMedium:{name:'잡종세포가 들어있는 배지', desc:'잡종세포를 옮겨 담은 HAT 배지.\n세포 배양기에서 키워야 한다.'},
  hybridCultured:{name:'배양된 잡종세포', desc:'HAT 배지에서 살아남아 증식한 잡종세포 집단.\n서로 다른 항체를 만드는 세포들이 섞여 있다.'},
  cloneA:{name:'클론 A', desc:'하나의 잡종세포에서 증식한 세포 집단 A.\n한 종류의 항체(단클론항체)만 만든다.'},
  cloneB:{name:'클론 B', desc:'하나의 잡종세포에서 증식한 세포 집단 B.\n한 종류의 항체(단클론항체)만 만든다.'},
  cloneC:{name:'클론 C', desc:'하나의 잡종세포에서 증식한 세포 집단 C.\n한 종류의 항체(단클론항체)만 만든다.'},
  cloneD:{name:'클론 D', desc:'하나의 잡종세포에서 증식한 세포 집단 D.\n한 종류의 항체(단클론항체)만 만든다.'},
  cloneE:{name:'클론 E', desc:'하나의 잡종세포에서 증식한 세포 집단 E.\n한 종류의 항체(단클론항체)만 만든다.'},
  cloneCCultured:{name:'배양된 클론 C', desc:'대량으로 배양한 클론 C.\n치료제를 만들 만큼 단클론항체를 얻을 수 있다.'},
  treatY:{name:'좀비 바이러스 치료제', desc:''},
  edited:{name:'유전자가 편집된 클론', desc:'항체 가변부위 DNA를 새로운 염기서열로 바꾼 클론.'},
  treatZ:{name:'1회용 좀비 바이러스 치료제', desc:'유전자가 편집된 클론에서 얻은 항체로 만든 1회용 치료제.'},
};
const DONE_TXT='이곳에서 해야 할 작업을 마쳤습니다.', NOTYET_TXT='아직 상호작용할 수 없습니다.';

/* ===================================================================== */
const $=s=>document.querySelector(s);
let SPEED=1;
const wait=ms=>new Promise(r=>setTimeout(r,ms/SPEED));
const IS_MOBILE=(()=>{const m=new URLSearchParams(location.search).get('mode');
  if(m==='mobile')return true; if(m==='desktop')return false;
  return matchMedia('(pointer:coarse)').matches && Math.min(screen.width,screen.height)<900;})();
document.body.classList.toggle('mobile',IS_MOBILE);
document.body.classList.toggle('ml',FEATURES.mobileLayout);
document.body.classList.toggle('a11y',FEATURES.a11y);
const LETTERS=['A','B','C','D','E'];
const other=l=>l==='A'?'B':'A';

function fade(el,to,ms=300){
  if(!el) return Promise.resolve();
  const from=getComputedStyle(el).opacity;
  const a=el.animate([{opacity:from},{opacity:to}],{duration:Math.max(1,ms/SPEED),easing:'ease',fill:'forwards'});
  return a.finished.then(()=>{el.style.opacity=to;a.cancel();}).catch(()=>{});
}
function moveTo(el,x,y,ms){
  const a=el.animate([{left:el.style.left,top:el.style.top},{left:x+'%',top:y+'%'}],{duration:Math.max(1,ms/SPEED),easing:'ease-in-out',fill:'forwards'});
  return a.finished.then(()=>{el.style.left=x+'%';el.style.top=y+'%';a.cancel();}).catch(()=>{});
}

/* ---------------- 효과음 ---------------- */
let AC=null;
function sfx(n){
  if(!FEATURES.sfx) return; const d=SFX[n]; if(!d) return;
  if(typeof d==='string'){ try{ new Audio(d).play().catch(()=>{}); }catch(e){} return; }
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const t0=AC.currentTime+.01;
    if(d.type==='noise'){
      const len=Math.floor(AC.sampleRate*d.d), buf=AC.createBuffer(1,len,AC.sampleRate), ch=buf.getChannelData(0);
      for(let i=0;i<len;i++) ch[i]=(Math.random()*2-1)*(1-i/len);
      const src=AC.createBufferSource(), g=AC.createGain(); src.buffer=buf; g.gain.value=d.v; src.connect(g).connect(AC.destination); src.start(t0);
      return;
    }
    d.f.forEach((f,i)=>{ const o=AC.createOscillator(), g=AC.createGain(), st=t0+i*d.d;
      o.type=d.type; o.frequency.value=f; g.gain.setValueAtTime(d.v,st); g.gain.exponentialRampToValueAtTime(.0001,st+d.d);
      o.connect(g).connect(AC.destination); o.start(st); o.stop(st+d.d+.03); });
  }catch(e){}
}

/* ---------------- 상태 ---------------- */
function freshState(){ return {
  v:1, phase:'tutorial', skipped:false, inv:Array(8).fill(null), rat:null, editLetter:null,
  stock:['epithelial','cancer','medium'], flags:{}, quest:null, muted:false, player:null,
  pop:{ table:{stage:'idle',placed:{}}, incubator:{stage:'idle'}, fusion:{stage:'idle',placed:{}}, microscope:{stage:'idle',n:0},
        tester:{stage:'idle',placed:{},ant:{},checked:[],left:['A','B','D','E']}, producer:{stage:'idle'}, editor:{stage:'idle'} }
};}
let S=freshState();
const SAVE_KEY='sciLabMeta.v1';
let NOSAVE=false; // 처음부터 다시 시 새로고침 직전 재저장 방지
function canSave(){ return FEATURES.save && !NOSAVE && S.phase!=='tutorial' && !busyN && !popupAnim; }

/* ---------------- 픽셀 그리기 도구 ---------------- */
function R(c,x,y,w,h,col){ c.fillStyle=col; c.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h)); }
function box(c,x,y,w,h,fill,light,dark,line='#121416'){ R(c,x,y,w,h,line); R(c,x+1,y+1,w-2,h-2,fill); if(light)R(c,x+1,y+1,w-2,1,light); if(dark)R(c,x+1,y+h-2,w-2,1,dark); }
function disc(c,cx,cy,r,col){ c.fillStyle=col; const x0=Math.floor(cx-r-1),x1=Math.ceil(cx+r+1),y0=Math.floor(cy-r-1),y1=Math.ceil(cy+r+1);
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const dx=x+.5-cx,dy=y+.5-cy; if(dx*dx+dy*dy<=r*r) c.fillRect(x,y,1,1);} }
function spr(c,rows,pal,ox=0,oy=0){ rows.forEach((row,y)=>{ for(let x=0;x<row.length;x++){ const p=pal[row[x]]; if(p) R(c,ox+x,oy+y,1,1,p);} }); }
const F3={A:['010','101','111','101','101'],B:['110','101','110','101','110'],C:['011','100','100','100','011'],D:['110','101','101','101','110'],
  E:['111','100','110','100','111'],'?':['111','001','010','000','010']};
function letter(c,ch,x,y,col){ (F3[ch]||F3['?']).forEach((r,j)=>{ for(let i=0;i<3;i++) if(r[i]==='1') R(c,x+i,y+j,1,1,col); }); }
function badge(c,ch){ if(!ch) return; R(c,0,0,5,7,'#111'); letter(c,ch,1,1,'#fff'); }
const ABCOL={A:'#e05a5a',B:'#e0a040',C:'#4aa8e0',D:'#5cbf5c',E:'#b072e0'};
const ABPAT={A:['101','010','010'],B:['101','101','010'],C:['111','010','010'],D:['111','101','010'],E:['010','111','010']};
function pat(c,p,x,y,col,rot){ for(let j=0;j<3;j++)for(let i=0;i<3;i++){ let a=i,b=j; for(let r=0;r<rot;r++){ const t=a; a=b; b=2-t; } if(p[b][a]==='1') R(c,x+i,y+j,1,1,col); } }
function cellAb(c,cx,cy,r,body,nuc,L){
  disc(c,cx,cy,r+.8,'#5a3a66'); disc(c,cx,cy,r,body); disc(c,cx-.6,cy-.4,r*.42,nuc);
  if(L){ const col=ABCOL[L],p=ABPAT[L], fx=Math.floor(cx), fy=Math.floor(cy), rr=Math.round(r);
    pat(c,p,fx-1,fy-rr-3,col,0); pat(c,p,fx+rr+1,fy-1,col,1); pat(c,p,fx-1,fy+rr+1,col,2); pat(c,p,fx-rr-3,fy-1,col,3); }
}

  slots.forEach((d,i)=>Object.assign(d.style,{left:(m+i*(s+g))+'px',top:((H-s)/2)+'px',width:s+'px',height:s+'px'}));

let SEL=null; const descEl=$('#desc');
function select(el,id,mode,action){
  deselect(); SEL={el,id}; el.classList.add('sel');
  descEl.innerHTML=`<div class="dn"></div><div class="dt"></div>`;
  descEl.querySelector('.dn').textContent=itemName(id); descEl.querySelector('.dt').textContent=itemDesc(id);
  if(mode==='take'||mode==='place'){ const b=document.createElement('button'); b.className='btn'; b.textContent=mode==='take'?'획득하기':'배치하기';
    b.onclick=e=>{ e.stopPropagation(); sfx('click'); if(mode==='take'){ deselect(); action(); } else placeSelected(id); };
    const w=document.createElement('div'); w.className='db'; w.appendChild(b); descEl.appendChild(w); }
  descEl.style.display='block'; descEl.style.left='0px'; descEl.style.top='0px';
  const r=el.getBoundingClientRect(), dw=descEl.offsetWidth, dh=descEl.offsetHeight, invH=invEl.offsetHeight;
  let top=r.top-dh-8; if(top<invH+4) top=r.bottom+8; if(top+dh>innerHeight-4) top=Math.max(invH+4,innerHeight-dh-4);
  const left=Math.min(innerWidth-dw-8,Math.max(8,r.left+r.width/2-dw/2));
  descEl.style.left=left+'px'; descEl.style.top=top+'px';
}
function deselect(){ if(!SEL) return; SEL.el.classList.remove('sel'); SEL=null; descEl.style.display='none'; }
document.addEventListener('pointerdown',e=>{ if(!SEL) return; if(descEl.contains(e.target)||SEL.el.contains(e.target)) return; deselect(); },true);

function setQuest(t){ S.quest=t; msgUpdate(); }
function stageMsg(t){ M.stage=t; msgUpdate(); }
function flash(t,ms=2000){ ms=Math.max(ms,FEATURES.a11y?2000:0); M.flash=t; clearTimeout(M.flashT); M.flashT=setTimeout(()=>{M.flash=null;msgUpdate();},ms/SPEED); msgUpdate(); }
async function msgUpdate(){
  const want=M.flash||M.stage||(popupMod||TUT.box?null:S.quest)||null;
  if(want===M.target) return; M.target=want; const tk=++M.token;
  if(+getComputedStyle(msgEl).opacity>0){ await fade(msgEl,0,300); if(tk!==M.token) return; }
  if(want){ msgT.textContent=want; msgEl.style.display='block'; await fade(msgEl,1,300); } else msgEl.style.display='none';
}

/* ---------------- 강조 ---------------- */
const hlEl=$('#hl'), hole=hlEl.querySelector('.hole'); let hlFn=null, hlTimer=null;
function hlShow(fn){ hlFn=fn; hlEl.style.display='block'; hole.classList.remove('blink'); hlTrack(); clearTimeout(hlTimer);
  hlTimer=setTimeout(()=>{ void hole.offsetWidth; hole.classList.add('blink'); },200/SPEED); }
function hlClear(){ hlFn=null; hlEl.style.display='none'; hole.classList.remove('blink'); clearTimeout(hlTimer); }
// 테두리가 화면 밖으로 잘리지 않도록 화면 안쪽으로 맞추고, 노란 선은 강조 영역 안쪽에 그린다(네 변 모두 보이게)
function hlTrack(){ if(!hlFn) return; const r=hlFn(); if(!r) return;
  const l=Math.max(0,r.left-4), t=Math.max(0,r.top-4), rr=Math.min(innerWidth,r.left+r.width+4), b=Math.min(innerHeight,r.top+r.height+4);
  Object.assign(hole.style,{left:l+'px',top:t+'px',width:(rr-l)+'px',height:(b-t)+'px'}); }
const elRect=el=>()=>el&&el.getBoundingClientRect();
function objRect(id){ const o=OBJECTS.find(o=>o.id===id); return ()=>{ const wr=worldEl.getBoundingClientRect(), s=MAPR.s;
  return {left:wr.left+MAPR.left+o.x*TW*s,top:wr.top+MAPR.top+(o.y-o.top)*TW*s,width:o.w*TW*s,height:(o.h+o.top)*TW*s}; }; }

/* ---------------- 상자 (튜토리얼·텍스트) ---------------- */
let boxN=0;
function makeBox(text,btns,{parent=document.body,input=false,inpop=false}={}){
  const el=document.createElement('div'); el.className='box'+(inpop?' inpop':''); const tx=document.createElement('div'); tx.textContent=text; el.appendChild(tx);
  let inp=null; if(input){ inp=document.createElement('input'); inp.autocomplete='off'; inp.spellcheck=false; el.appendChild(inp); }
  const bw=document.createElement('div'); bw.className='btns'; el.appendChild(bw);
  let resolve; const p=new Promise(r=>resolve=r);
  btns.forEach(([k,label])=>{ const b=document.createElement('button'); b.className='btn'; b.textContent=label; b.onclick=e=>{e.stopPropagation(); sfx('click'); resolve(k);}; bw.appendChild(b); });
  parent.appendChild(el); if(!inpop) boxN++;
  return {el,inp,result:p,async close(ms=300){ await fade(el,0,ms); el.remove(); if(!inpop) boxN--; }};
}
async function textBox(text,btns){ const b=makeBox(text,btns); fade(b.el,1,300); const k=await b.result; await b.close(300); return k; }

/* ---------------- 팝업 ---------------- */
const popupEl=$('#popup'), stageEl=$('#stage'), actsEl=$('#acts'), pcloseEl=$('#pclose');
let popupMod=null, popupAnim=false, busyN=0, popSess=0;
async function run(fn){ busyN++; updateX(); try{ await fn(); } catch(e){ console.error(e); } finally{ busyN--; updateX(); if(!busyN) save(); } }
function later(ms,fn){ const s=popSess; setTimeout(()=>{ if(s===popSess&&popupMod&&!popupAnim) fn(); },ms/SPEED); }
function updateX(){ const show=FEATURES.closeButton&&popupMod&&!busyN&&!popupAnim&&S.phase==='dev'&&!(popupMod.noClose&&popupMod.noClose());
  pcloseEl.style.display=show?'flex':'none'; }
function slide(up){ const a=popupEl.animate([{transform:up?'translateY(100%)':'translateY(0)'},{transform:up?'translateY(0)':'translateY(100%)'}],
  {duration:500/SPEED,easing:up?'cubic-bezier(.2,.8,.3,1)':'cubic-bezier(.6,0,.8,.4)',fill:'forwards'});
  return a.finished.then(()=>{ popupEl.style.transform=up?'translateY(0)':'translateY(100%)'; a.cancel(); }); }
const P={
  q:k=>popupEl.querySelector(`[data-k="${k}"]`),
  clear(){ stageEl.innerHTML=''; actsEl.innerHTML=''; popupEl.querySelectorAll('.box.inpop').forEach(b=>b.remove()); },
  illus(name,{k='ill',o=1,arg}={}){ const cv=mkCanvas(200,125,c=>ILL[name](c,arg)); cv.className='ill'; cv.dataset.k=k; cv.style.opacity=o; stageEl.appendChild(cv); return cv; },
  item(id,x,y,o={}){ const d=document.createElement('div'); d.className='pitem'; d.dataset.k=o.k||id;
    Object.assign(d.style,{left:x+'%',top:y+'%',width:(o.size||11)+'%',opacity:o.o??1}); d.innerHTML=`<img src="${iconURL(id)}" draggable="false">`;
    if(o.take){ d.classList.add('clickable'); d.onclick=e=>{ e.stopPropagation(); if(busyN||popupAnim) return; if(o.can&&!o.can()) return;
      d.classList.remove('gold'); select(d,id,'take',()=>run(()=>o.take(d))); }; }
    stageEl.appendChild(d); return d; },
  sprite(key,x,y,size,o={}){ const d=document.createElement('div'); d.className='psprite'; d.dataset.k=o.k||key;
    Object.assign(d.style,{left:x+'%',top:y+'%',width:size+'%',opacity:o.o??1}); d.innerHTML=`<img src="${iconURL(key)}" draggable="false">`;
    if(o.click){ d.style.cursor='pointer'; d.onclick=e=>{e.stopPropagation(); o.click(d);}; } stageEl.appendChild(d); return d; },
  text(t,x,y,o={}){ const d=document.createElement('div'); d.className='ptext'; d.dataset.k=o.k||'txt'; d.textContent=t; Object.assign(d.style,{left:x+'%',top:y+'%',opacity:o.o??1}); stageEl.appendChild(d); return d; },
  btn(label,fn,o={}){ const b=document.createElement('button'); b.className='btn'; b.textContent=label; b.dataset.k=o.k||'btn'; if(o.o!=null) b.style.opacity=o.o;
    b.onclick=e=>{ e.stopPropagation(); if(busyN||popupAnim) return; sfx('click'); fn(b); }; actsEl.appendChild(b); return b; },
  note(t,o={}){ const d=document.createElement('div'); d.className='pp-note'; d.dataset.k=o.k||'note'; d.textContent=t; d.style.opacity=o.o??1; actsEl.appendChild(d); return d; },
  remove(...ks){ ks.forEach(k=>{ const e=typeof k==='string'?P.q(k):k; if(e) e.remove(); }); },
  fadeOut(ms,...els){ return Promise.all(els.map(e=>typeof e==='string'?P.q(e):e).filter(Boolean).map(e=>fade(e,0,ms).then(()=>e.remove()))); },
  fadeIn(ms,...els){ return Promise.all(els.filter(Boolean).map(e=>fade(e,1,ms))); },
};
async function openPopup(mod){
  deselect(); popupMod=mod; popSess++; popupAnim=true; P.clear(); mod.render();
  popupEl.style.display='flex'; sfx('open'); msgUpdate(); updateX(); await slide(true); popupAnim=false; updateX(); if(mod.enter) mod.enter();
}
async function closePopup(){
  if(!popupMod) return; popSess++; deselect(); M.stage=null; popupAnim=true; updateX(); sfx('close');
  const p=slide(false); msgUpdate(); await p; popupEl.style.display='none'; popupMod=null; popupAnim=false; P.clear(); msgUpdate(); updateX(); save();
}
pcloseEl.onclick=e=>{ e.stopPropagation(); if(pcloseEl.style.display!=='none') closePopup(); };
async function takeItem(el,id){ sfx('get'); deselect(); el.style.pointerEvents='none'; await fade(el,0,300); el.remove(); await inv.add(id); }
function placeSelected(id){
  const mod=popupMod; const fn=(mod&&mod.accept&&!busyN&&!popupAnim)?mod.accept(id):null; deselect();
  if(!fn){ sfx('error'); flash('올바른 용도가 아닙니다.',1500); return; }
  run(async()=>{ sfx('place'); await inv.remove(id); await fn(); });
}
const hasAll=ids=>ids.every(i=>inv.has(i));

/* ---- 세포 배양기 ---- */
const INC_POS={epithelial:[37,33],cancer:[63,33],medium:[50,69]};
const IQ_H='세포 배양기에서 잡종세포를 배양하세요.', IQ_C='세포 배양기에서 클론 C를 배양하세요.';
MODS.incubator={
  get I(){ return S.pop.incubator; },
  async tryOpen(){ const I=this.I;
    if(I.prog) return openPopup(this);
    const mode=inv.has('hybridMedium')?'hybrid':(inv.has('cloneC')&&S.flags.testerDone)?'clone':null;
    if(mode){ I.mode=mode; I.stage='cWait'; if(S.quest===IQ_H||S.quest===IQ_C) setQuest(null); lockN++; await wait(500); lockN--; return openPopup(this); }
    if(S.stock.length){ I.stage='initial'; return openPopup(this); }
    flash(DONE_TXT);
  },
  noClose(){ return S.phase!=='dev'; },
  render(){ const I=this.I;
    if(I.stage==='initial'){ P.illus('incOpen'); S.stock.forEach(id=>P.item(id,...INC_POS[id],{take:el=>this.takeStock(el,id),
      can:()=>S.phase==='dev'||(id==='epithelial'&&TUT.canTake)})); }
    if(I.stage==='cWait') P.illus('incOpen');
    if(I.stage==='cDone'){ P.illus('incClosed'); this.doorBtn(); }
    if(I.stage==='cResult'){ P.illus('incOpen'); this.resItem(1); }
  },
  enter(){ const I=this.I;
    if(I.stage==='cWait') later(500,()=>{ if(I.stage==='cWait') stageMsg(I.mode==='hybrid'?'세포 배양기에 잡종세포가 들어있는 배지를 넣으세요':'배양기에 클론 C를 넣으세요'); });
    if(I.stage==='cDone') stageMsg('배양 완료!');
  },
  async takeStock(el,id){ S.stock=S.stock.filter(x=>x!==id);
    if(S.phase==='tutorial'){ TUT.canTake=false; const p=takeItem(el,id); tutAfterTake(); await p; return; }
    await takeItem(el,id); if(!S.stock.length){ await wait(500); await closePopup(); } },
  accept(id){ const I=this.I; const need=I.mode==='hybrid'?'hybridMedium':'cloneC';
    if(I.stage!=='cWait'||id!==need) return null;
    return async()=>{ I.prog=true; I.stage='culturing'; stageMsg(null); const it=P.item(id,50,33,{k:'cin',o:0}); await fade(it,1);
      await wait(1000); await P.fadeOut(300,'ill',it); await fade(P.illus('incClosed',{k:'closed',o:0}),1,300);
      await wait(500); stageMsg('배양 중'); await wait(5000); stageMsg(null); await wait(500);
      stageMsg('배양 완료!'); sfx('done'); I.stage='cDone'; this.doorBtn(); };
  },
  doorBtn(){ P.btn('문 열기',b=>run(async()=>{ const I=this.I; await wait(300); b.remove(); stageMsg(null);
    await P.fadeOut(300,...stageEl.querySelectorAll('.ill')); const ill=P.illus('incOpen',{o:0}); const it=this.resItem(0); I.stage='cResult'; await P.fadeIn(300,ill,it); })); },
  resItem(o){ const id=this.I.mode==='hybrid'?'hybridCultured':'cloneCCultured'; return P.item(id,50,33,{o,take:el=>this.takeRes(el,id)}); },
  async takeRes(el,id){ const I=this.I; await takeItem(el,id); S.flags[I.mode==='hybrid'?'hybridCultured':'cloneCCultured']=true;
    I.prog=false; I.stage='idle'; await wait(500); await closePopup(); },
};

const cineEl=$('#cine'); let cineOn=false;
function playVideo(src){ return new Promise(res=>{
  cineOn=true; cineEl.innerHTML=''; cineEl.style.display='flex'; cineEl.style.opacity=1;
  const v=document.createElement('video'); v.src=src; v.playsInline=true; v.setAttribute('playsinline',''); cineEl.appendChild(v);
  let done=false; const fin=()=>{ if(done) return; done=true; v.remove(); res(); };
  v.onended=fin;
  v.onerror=()=>{ v.remove(); placeholder(src).then(fin); };
  v.play().catch(()=>{ if(!done&&v.isConnected){ const b=document.createElement('button'); b.className='btn'; b.textContent='▶ 영상 재생'; b.style.position='absolute';
    b.onclick=()=>{ b.remove(); v.play(); }; cineEl.appendChild(b); } });
  if(DBG.on){ const sk=document.createElement('button'); sk.className='btn'; sk.textContent='건너뛰기(디버그)'; Object.assign(sk.style,{position:'absolute',right:'12px',bottom:'12px'});
    sk.onclick=()=>{ sk.remove(); fin(); }; cineEl.appendChild(sk); }
});}
function placeholder(src){ return new Promise(res=>{
  const d=document.createElement('div'); d.className='ph'; cineEl.appendChild(d); let t=VIDEO.placeholderSec;
  const draw=()=>{ d.innerHTML=`영상 자리 (${src})<br>파일을 넣으면 이곳에서 재생됩니다.<br>${t}초`; }; draw();
  const sk=document.createElement('button'); sk.className='btn'; sk.textContent='건너뛰기'; sk.style.marginTop='14px';
  let iv; const end=()=>{ clearInterval(iv); d.remove(); sk.remove(); res(); };
  sk.onclick=end; cineEl.appendChild(sk); iv=setInterval(()=>{ t--; draw(); if(t<=0) end(); },1000/SPEED);
});}
async function ending1Prompt(){
  lockN++; await textBox('이제 좀비 바이러스 치료제를 감염된 사람들에게 투여해 봅시다.',[['go','투여하기']]);
  await playVideo(VIDEO.ending1); await fade(cineEl,0,2000); cineEl.style.display='none'; cineEl.innerHTML=''; cineOn=false;
  await textBox('치료제를 투여해도 치료되지 않는 감염자가 나타났습니다. 과학 선생님의 일지에는 해결 방법이 나와 있지 않습니다...',[['ok','해결 방법을 생각해 보자.']]);
  S.flags.ending1Seen=true; lockN--; save();
}
async function ending2Prompt(){
  lockN++; await textBox('이제 두 좀비 바이러스 치료제를 섞어 마지막 감염된 사람들에게 투여해 봅시다.',[['go','투여하기']]);
  await playVideo(VIDEO.ending2); S.phase='ending'; S.flags.finished=true; lockN--; save(); showEnd(false);
}
async function showEnd(instant){
  cineOn=true; cineEl.innerHTML='<div class="endt">당신은 좀비 바이러스를 막고 학교를 지켜낸 영웅입니다!</div><div class="endb">The END</div>';
  cineEl.style.display='flex'; cineEl.style.opacity=1; const [a,b]=cineEl.children;
  const r=document.createElement('button'); r.className='btn endr'; r.textContent='처음부터 다시'; r.onclick=e=>{ e.stopPropagation(); askRestart(); }; cineEl.appendChild(r);
  if(instant){ a.style.opacity=1; b.style.opacity=1; r.style.opacity=1; return; }
  sfx('end'); await fade(a,1,1000); await fade(b,1,3000); await wait(1000); await fade(r,1,500);
}
async function askRestart(){ if(boxN) return;
  const k=await textBox('처음부터 다시 시작할까요?\n지금까지의 진행 상황이 모두 지워집니다.',[['no','취소'],['yes','처음부터 다시']]);
  if(k==='yes'){ clearSave(); location.reload(); } }
const restartEl=$('#restart'); restartEl.onclick=e=>{ e.stopPropagation(); askRestart(); };

/* ---------------- 튜토리얼 ---------------- */
const TUT={lock:false,waitInc:false,canTake:false,box:false};
const tutEl=$('#tut');
function tut(text,btns){ return new Promise(res=>{
  TUT.box=true; msgUpdate(); tutEl.querySelector('.tx').textContent=text; const bw=tutEl.querySelector('.btns'); bw.innerHTML='';
  btns.forEach(([k,l])=>{ const b=document.createElement('button'); b.className='btn'; b.textContent=l; b.onclick=e=>{e.stopPropagation(); sfx('click'); res(k);}; bw.appendChild(b); });
  if(tutEl.style.display!=='block'){ tutEl.style.display='block'; fade(tutEl,1,200); }
});}
async function tutHide(){ await fade(tutEl,0,200); tutEl.style.display='none'; TUT.box=false; msgUpdate(); }
async function runTutorial(){
  TUT.lock=true;
  const r=await tut('이곳은 XX과학고등학교의 과학실입니다.',[['skip','튜토리얼 건너뛰기'],['next','다음']]);
  if(r==='skip'){ await tutHide(); return finishTutorial(true); }
  await tutHide(); hlShow(elRect(worldEl)); await wait(1500);
  await tut('과학실 내부에는 다양한 재료와 실험 장비들이 갖춰져 있습니다.',[['next','다음']]); hlClear();
  await tut('교사 A가 남긴 연구일지를 읽고 세포 융합 기술을 활용하여 단클론항체 치료제를 만드십시오.',[['next','다음']]);
  await tut(IS_MOBILE?'가상 조이패드를 이용하여 이동할 수 있습니다.':'방향키나 WASD, 또는 마우스 클릭으로 이동할 수 있습니다.',[['next','다음']]);
  await tutHide(); hlShow(objRect('incubator')); await wait(1500);
  await tut(IS_MOBILE?"특정 사물에 다가가면 '상호작용' 버튼을 눌러 상호작용할 수 있습니다.":'특정 사물에 다가가면 스페이스 바를 눌러 상호작용할 수 있습니다.',[['next','다음']]);
  await tutHide(); hlClear(); await wait(500); setQuest('세포 배양기를 조사하세요.'); TUT.lock=false; TUT.waitInc=true;
}
async function tutIncubator(){
  TUT.waitInc=false; setQuest(null); S.pop.incubator.stage='initial'; await openPopup(MODS.incubator);
  await wait(1000); hlShow(elRect(popupEl)); stageMsg('사물에 상호작용하면 특정한 작업을 할 수 있는 영역이 열립니다.');
  await wait(2000); stageMsg(null); hlShow(elRect(P.q('epithelial'))); await wait(1500);
  stageMsg("안에 있는 물건을 클릭한 뒤 '획득하기' 버튼을 누르면 그것을 획득할 수 있습니다"); TUT.canTake=true;
}
async function tutAfterTake(){
  TUT.lock=true; hlClear(); stageMsg(null); await wait(300); await closePopup(); await wait(2000);
  hlShow(elRect(invEl)); await tut('이곳에서 당신이 가지고 있는 물건을 확인할 수 있습니다.',[['next','다음']]);
  await tut("물건을 배치해야 할 때에는 인벤토리에서 물건을 클릭한 뒤 '배치하기' 버튼을 누르면 됩니다.",[['next','다음']]);
  await tutHide(); hlShow(objRect('fusion')); stageMsg('어떤 사물은 정해진 물건을 인벤토리에 가지고 있을 때에만 상호작용할 수 있습니다');
  await wait(2000); stageMsg(null); hlClear();
  await tut('교사 A가 남긴 연구 일지를 읽고 순서에 맞게 치료제를 개발하십시오',[['ok','확인']]); await tutHide(); finishTutorial(false);
}
function finishTutorial(skipped){ S.phase='dev'; S.skipped=skipped; TUT.lock=false; TUT.waitInc=false; hlClear(); save(); }

/* ---------------- 입력·이동 ---------------- */
let lockN=0;
const locked=()=>!!popupMod||popupAnim||lockN>0||boxN>0||TUT.lock||TUT.box||cineOn||S.phase==='ending';
const KEYS={}; const PADK={};
const KMAP={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};
let _kb='';
function _h(s){ let h=0x811c9dc5; for(const ch of s){ h^=ch.charCodeAt(0); h=Math.imul(h,0x01000193)>>>0; } return h; }
function _c(e){ const c=e.code; if(/^Key[A-Z]$/.test(c)) return c[3].toLowerCase(); if(/^Digit\d$/.test(c)) return c[5]; if(/^Numpad\d$/.test(c)) return c[6];
  if(c==='Slash'||c==='NumpadDivide') return '/'; return '#'; }
addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='INPUT') return;
  if(FEATURES.debug&&!e.repeat){ _kb=(_kb+_c(e)).slice(-8); if(_h(_kb)===3284227405){ _kb=''; toggleDebug(); } }
  if(KMAP[e.code]){ KEYS[KMAP[e.code]]=true; e.preventDefault(); }
  if(e.code==='Space'){ e.preventDefault(); if(!e.repeat) tryInteract(); }
  if(e.code==='Escape'&&pcloseEl.style.display==='flex') closePopup();
});
addEventListener('keyup',e=>{ if(KMAP[e.code]) KEYS[KMAP[e.code]]=false; });
addEventListener('blur',()=>{ for(const k in KEYS) KEYS[k]=false; });
document.querySelectorAll('#pad button').forEach(b=>{ const d=b.dataset.d;
  const on=e=>{ e.preventDefault(); PADK[d]=true; b.classList.add('on'); }, off=()=>{ PADK[d]=false; b.classList.remove('on'); };
  b.addEventListener('pointerdown',on); b.addEventListener('pointerup',off); b.addEventListener('pointerleave',off); b.addEventListener('pointercancel',off); });
$('#act').addEventListener('pointerdown',e=>{ e.preventDefault(); e.stopPropagation(); tryInteract(); });
mapCv.addEventListener('pointerdown',e=>{
  if(locked()) return; const r=mapCv.getBoundingClientRect(); const mx=(e.clientX-r.left)/MAPR.s, my=(e.clientY-r.top)/MAPR.s;
  PL.path=findPath(mx,my);
});
function blocked(x,y){ for(const [px,py] of [[x-5,y-3],[x+5,y-3],[x-5,y+3],[x+5,y+3]]){ const tx=Math.floor(px/TW), ty=Math.floor(py/TW);
  if(tx<0||ty<0||tx>=MW||ty>=MH||SOLID[ty][tx]) return true; } return false; }
function findPath(mx,my){
  const sx=Math.floor(PL.x/TW), sy=Math.floor(PL.y/TW); const dist=[...Array(MH)].map(()=>Array(MW).fill(-1)), prev={};
  const q=[[sx,sy]]; dist[sy][sx]=0;
  while(q.length){ const [x,y]=q.shift(); for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const nx=x+dx, ny=y+dy;
    if(nx<0||ny<0||nx>=MW||ny>=MH||SOLID[ny][nx]||dist[ny][nx]>=0) continue; dist[ny][nx]=dist[y][x]+1; prev[nx+','+ny]=[x,y]; q.push([nx,ny]); } }
  let best=null, bd=1e9; for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){ if(dist[y][x]<0) continue;
    const d=Math.hypot((x+.5)*TW-mx,(y+.5)*TW-my)+dist[y][x]*.01; if(d<bd){ bd=d; best=[x,y]; } }
  if(!best) return null; const path=[]; let cur=best;
  while(cur&&!(cur[0]===sx&&cur[1]===sy)){ path.unshift([(cur[0]+.5)*TW,(cur[1]+.5)*TW]); cur=prev[cur[0]+','+cur[1]]; }
  return path.length?path:null;
}
let NEAR=null; const labelsEl=$('#labels'), hintEl=$('#hint'), actEl=$('#act');
function tryInteract(){ if(locked()||!NEAR) return; interact(NEAR); }
function interact(o){
  if(S.phase==='tutorial'){ if(TUT.waitInc&&o.id==='incubator') tutIncubator(); return; }
  if(S.phase!=='dev') return; deselect(); MODS[o.id].tryOpen();
}
function updateNear(){
  let n=null; for(const o of OBJECTS){ const x0=o.x*TW-6, y0=o.y*TW-6, x1=(o.x+o.w)*TW+6, y1=(o.y+o.h)*TW+6;
    if(PL.x+5>x0&&PL.x-5<x1&&PL.y+3>y0&&PL.y-3<y1){ n=o; break; } }
  NEAR=n; const show=n&&!locked();
  if(show){ let lb=labelsEl.firstChild; if(!lb){ lb=document.createElement('div'); lb.className='olabel'; labelsEl.appendChild(lb); }
    lb.textContent=n.name; lb.style.left=(MAPR.left+(n.x+n.w/2)*TW*MAPR.s)+'px'; lb.style.top=(MAPR.top+(n.y-n.top)*TW*MAPR.s-4)+'px'; }
  else labelsEl.innerHTML='';
  restartEl.style.display=S.phase==='dev'&&!locked()?'block':'none';
  hintEl.style.display=show&&!IS_MOBILE?'block':'none'; actEl.style.display=show&&IS_MOBILE?'block':'none';
}
let last=performance.now();
function frame(t){
  const dt=Math.min(.05,(t-last)/1000); last=t;
  let dx=0, dy=0;
  if(!locked()){ const K=k=>KEYS[k]||PADK[k];
    if(K('left'))dx-=1; if(K('right'))dx+=1; if(K('up'))dy-=1; if(K('down'))dy+=1;
    if(dx||dy) PL.path=null;
    else if(PL.path){ const [tx,ty]=PL.path[0]; const ddx=tx-PL.x, ddy=ty-PL.y, d=Math.hypot(ddx,ddy);
      if(d<1.5){ PL.x=tx; PL.y=ty; PL.path.shift(); if(!PL.path.length) PL.path=null; } else { dx=ddx/d; dy=ddy/d; } }
  } else PL.path=null;
  if(dx||dy){ const sp=72*dt, l=Math.hypot(dx,dy); const vx=dx/l*sp, vy=dy/l*sp; let moved=false;
    if(!blocked(PL.x+vx,PL.y)){ PL.x+=vx; moved=true; } if(!blocked(PL.x,PL.y+vy)){ PL.y+=vy; moved=true; }
    if(!moved) PL.path=null;
    PL.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'); PL.walk+=dt*8;
    if(SEL&&!popupMod) deselect();
  } else PL.walk=0;
  mctx.imageSmoothingEnabled=false; mctx.drawImage(FLOOR,0,0);
  const list=SPRITES.map(s=>({b:s.base,draw:()=>mctx.drawImage(s.cv,s.x,s.y)}));
  list.push({b:PL.y+3,draw:()=>{ mctx.fillStyle='rgba(0,0,0,.25)'; mctx.fillRect(Math.round(PL.x)-5,Math.round(PL.y)+1,10,3);
    mctx.drawImage(playerSprite(PL.dir,Math.floor(PL.walk)%2),Math.round(PL.x)-6,Math.round(PL.y)-15); }});
  list.sort((a,b)=>a.b-b.b).forEach(o=>o.draw());
  updateNear(); hlTrack();
  requestAnimationFrame(frame);
}

/* ---------------- 디버그 (비공개) ---------------- */
const DBG={on:false};
const STEPS=[
  ['튜토리얼 건너뛴 직후',s=>{ s.phase='dev'; s.skipped=true; }],
  ['튜토리얼 완료 직후',s=>{ s.stock=['cancer','medium']; s.inv[0]='epithelial'; }],
  ['재료 모두 획득(쥐 A)',s=>{ s.stock=[]; s.rat='A'; ['cancer','medium','ratA','virus'].forEach(i=>add(s,i)); s.flags.hazardDone=true; }],
  ['B림프구 획득',s=>{ rep(s,'ratA','bcell'); s.flags.tableBDone=true; }],
  ['잡종세포 획득',s=>{ rm(s,'cancer'); rep(s,'bcell','hybrid'); s.flags.fusionDone=true; s.quest=TQ; }],
  ['배지 이식 완료',s=>{ rm(s,'medium'); rep(s,'hybrid','hybridMedium'); s.flags.tableTransferDone=true; s.quest=IQ_H; }],
  ['잡종세포 배양 완료',s=>{ rep(s,'hybridMedium','hybridCultured'); s.flags.hybridCultured=true; s.quest=null; }],
  ['클론 A~E 획득',s=>{ rm(s,'hybridCultured'); LETTERS.forEach(l=>add(s,'clone'+l)); s.flags.microscopeDone=true; }],
  ['클론 C 선택 완료',s=>{ ['epithelial','virus','cloneA','cloneB','cloneD','cloneE'].forEach(i=>rm(s,i)); s.flags.testerDone=true; s.quest=IQ_C; }],
  ['클론 C 배양 완료',s=>{ rep(s,'cloneC','cloneCCultured'); s.flags.cloneCCultured=true; s.quest=null; }],
  ['치료제 Y 완성(엔딩1 본 뒤)',s=>{ rep(s,'cloneCCultured','treatY'); s.flags.treatmentYDone=true; s.flags.ending1Seen=true; }],
  ['검사기에서 클론 A 회수',s=>{ add(s,'cloneA'); s.pop.tester.left=['B','D','E']; s.flags.testerSecondDone=true; }],
  ['유전자 편집 완료',s=>{ rep(s,'cloneA','edited'); s.editLetter='A'; s.flags.geneEditDone=true; }],
];
function add(s,id){ const i=s.inv.indexOf(null); if(i>=0) s.inv[i]=id; }
function rm(s,id){ const i=s.inv.indexOf(id); if(i>=0) s.inv[i]=null; }
function rep(s,a,b){ const i=s.inv.indexOf(a); if(i>=0) s.inv[i]=b; else add(s,b); }
function applyState(ns){
  popSess++; popupMod=null; popupAnim=false; busyN=0; lockN=0; popupEl.style.display='none'; popupEl.style.transform='translateY(100%)'; P.clear();
  document.querySelectorAll('.box').forEach(b=>b.remove()); boxN=0; tutEl.style.display='none'; tutEl.style.opacity=0; TUT.lock=TUT.box=TUT.waitInc=TUT.canTake=false;
  cineOn=false; cineEl.style.display='none'; cineEl.innerHTML=''; hlClear(); deselect(); M.stage=null; M.flash=null;
  const keepMute=S.muted; S=ns; S.muted=keepMute; for(const k in ICACHE) delete ICACHE[k]; renderInv(); msgUpdate(); updateX(); save();
}
function toggleDebug(){ DBG.on=!DBG.on; const d=$('#dbg'); if(!DBG.on){ d.style.display='none'; SPEED=1; return; } buildDebug(); d.style.display='block'; }
function buildDebug(){ const d=$('#dbg');
  d.innerHTML=`<div class="h">디버그</div><div id="dSteps"></div><div class="h">쥐 선택</div><button data-r="A">쥐 A</button><button data-r="B">쥐 B</button>
    <div class="h">속도</div><button data-sp="1">×1</button><button data-sp="4">×4</button><button data-sp="10">×10</button> <span id="dSp"></span>
    <div class="h">아이템</div><select id="dItem">${Object.keys(ITEMS).map(k=>`<option value="${k}">${itemName(k)}</option>`).join('')}</select>
    <button id="dGive">지급</button><button id="dClear">인벤토리 비우기</button>
    <div class="h">기타</div><button id="dTut">튜토리얼 처음부터</button><button id="dReset">저장 삭제</button><button id="dClose">닫기</button>`;
  const st=d.querySelector('#dSteps');
  STEPS.forEach((s,i)=>{ const b=document.createElement('button'); b.textContent=(i+1)+'. '+s[0]; b.onclick=()=>{ const ns=freshState(); const r=S.rat&&S.rat!=='A'?S.rat:'A';
    for(let k=0;k<=i;k++) STEPS[k][1](ns); if(ns.rat&&r==='B'){ ns.rat='B'; ns.inv=ns.inv.map(x=>x==='ratA'?'ratB':x); } applyState(ns); }; st.appendChild(b); });
  d.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{ S.rat=b.dataset.r; S.inv=S.inv.map(x=>/^rat[AB]$/.test(x||'')?'rat'+S.rat:x); for(const k in ICACHE) delete ICACHE[k]; renderInv(); save(); });
  const sp=()=>d.querySelector('#dSp').textContent='현재 ×'+SPEED; sp();
  d.querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>{ SPEED=+b.dataset.sp; sp(); });
  d.querySelector('#dGive').onclick=()=>{ const id=d.querySelector('#dItem').value; if(/^treat|edited/.test(id)&&!S.rat) S.rat='A'; if(id==='edited'&&!S.editLetter) S.editLetter='A'; inv.add(id); };
  d.querySelector('#dClear').onclick=()=>{ S.inv=Array(8).fill(null); renderInv(); save(); };
  d.querySelector('#dTut').onclick=()=>{ applyState(freshState()); clearSave(); NOSAVE=false; runTutorial(); };
  d.querySelector('#dReset').onclick=()=>{ clearSave(); NOSAVE=false; };
  d.querySelector('#dClose').onclick=()=>toggleDebug();
}

/* ---------------- 시작 ---------------- */
addEventListener('beforeunload',()=>save());
document.addEventListener('visibilitychange',()=>{ if(document.hidden) save(); });
function start(){
  layout(); const sv=loadSave();
  if(sv&&sv.phase!=='tutorial'){ S=Object.assign(freshState(),sv); if(S.player){ PL.x=S.player.x; PL.y=S.player.y; PL.dir=S.player.dir||'up'; } }
  renderInv(); msgUpdate(); requestAnimationFrame(frame);
  if(S.phase==='tutorial') runTutorial();
  else if(S.flags.finished) showEnd(true);
  else if(S.flags.treatmentZDone) ending2Prompt();
  else if(S.flags.treatmentYDone&&!S.flags.ending1Seen) ending1Prompt();
}
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(start,start);
</script>
